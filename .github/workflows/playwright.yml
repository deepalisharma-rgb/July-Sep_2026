name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
jobs:
  test:
    timeout-minutes: 60
    runs-on: windows-latest #[ubuntu-latest, windows-latest, macos-latest] # Run tests on multiple OS
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/* #lts - long term support, current - latest stable version
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: Verify test credentials are available
      shell: pwsh
      env:
        TEST_USERNAME: ${{ secrets.TEST_USERNAME }}
        TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
      run: |
        if ([string]::IsNullOrWhiteSpace($env:TEST_USERNAME)) { throw 'GitHub secret TEST_USERNAME is missing or unavailable to this workflow.' }
        if ([string]::IsNullOrWhiteSpace($env:TEST_PASSWORD)) { throw 'GitHub secret TEST_PASSWORD is missing or unavailable to this workflow.' }
    - name: Run Playwright tests
      # We bind GitHub secrets to the custom environment variables your code reads
      env:
        TEST_USERNAME: ${{ secrets.TEST_USERNAME }}
        TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
      run: npx playwright test
    - uses: actions/upload-artifact@v4  # upload artifacts to GitHub 
      if: always()   #${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
