name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
jobs:
  test:
    timeout-minutes: 60
    runs-on: windows-latest #[ubuntu-latest, windows-latest, macos-latest] # Run tests on multiple OS
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/* #lts - long term support, current - latest stable version
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: Run Playwright tests
      run: npx playwright test
    - uses: actions/upload-artifact@v4  # upload artifacts to GitHub 
      if: always()   #${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
